name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  etcd-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: List etcd versions with pinned checksums
        run: |
          versions=$(sed --regexp-extended 's/.*etcd-(v[0-9.]+)-linux-.*/\1/' build/etcd.sha256 \
            | sort --unique --version-sort \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "versions=${versions}" >> "${GITHUB_OUTPUT}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    needs: etcd-versions
    strategy:
      fail-fast: false
      matrix:
        etcd: ${{ fromJSON(needs.etcd-versions.outputs.versions) }}
    name: test (etcd ${{ matrix.etcd }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install etcd
        env:
          ETCD_VERSION: ${{ matrix.etcd }}
        run: |
          archive="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl --silent --show-error --location --fail --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/${archive}"
          grep "  ${archive}\$" build/etcd.sha256 | (cd "${RUNNER_TEMP}" && sha256sum --check --strict)
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          echo "TEST_ETCD_BINARY=${RUNNER_TEMP}/etcd-${ETCD_VERSION}-linux-amd64/etcd" >> "${GITHUB_ENV}"
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    needs: etcd-versions
    strategy:
      fail-fast: false
      matrix:
        etcd: ${{ fromJSON(needs.etcd-versions.outputs.versions) }}
    name: e2e (etcd ${{ matrix.etcd }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build image
        run: make image IMAGE=twok:e2e VERSION=e2e
      - name: Run end-to-end tests
        env:
          E2E_IMAGE: twok:e2e
          ETCD_IMAGE: gcr.io/etcd-development/etcd:${{ matrix.etcd }}
        run: go test -tags e2e -timeout 20m -v ./test/e2e/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for every release platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci
          push: false

  policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.35.8
            node: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
            api: v1beta1
          - kubernetes: v1.36.4
            node: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
            api: v1
          - kubernetes: v1.37.0
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            api: v1
    name: policy (Kubernetes ${{ matrix.kubernetes }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Create cluster
        env:
          NODE_IMAGE: ${{ matrix.node }}
          API: ${{ matrix.api }}
        run: |
          config=()
          if [[ "${API}" == v1beta1 ]]; then
            config=(--config test/policy/kind-v1beta1.yaml)
          fi
          go run sigs.k8s.io/kind@v0.33.0 create cluster --name policy --image "${NODE_IMAGE}" "${config[@]}" --wait 2m
      - name: Apply the policy
        env:
          API: ${{ matrix.api }}
        run: |
          sed "s|admissionregistration.k8s.io/v1\$|admissionregistration.k8s.io/${API}|" deploy/twok-agent.yaml \
            | kubectl --context kind-policy apply --filename -
      - name: Wait for the API server to load the policy
        run: |
          canary='{"apiVersion":"v1","kind":"Pod","metadata":{"name":"canary","namespace":"default","labels":{"twok.aenix.io/inject":"true","etcd-operator.cozystack.io/cluster":"canary"}},"spec":{"automountServiceAccountToken":false,"containers":[{"name":"etcd","image":"etcd"}],"volumes":[{"name":"data","emptyDir":{}}]}}'
          for _ in $(seq 30); do
            if echo "${canary}" | kubectl --context kind-policy create --dry-run=server --output jsonpath='{.spec.initContainers[*].name}' --filename - | grep --quiet --word-regexp twok; then
              exit 0
            fi
            sleep 2
          done
          echo "the policy was not loaded within a minute" >&2
          exit 1
      - name: Test the policy
        env:
          POLICY_KUBE_CONTEXT: kind-policy
        run: go test -tags policy -count=1 -v ./test/policy/

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
