name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  etcd-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: List etcd versions with pinned checksums
        run: |
          versions=$(sed --regexp-extended 's/.*etcd-(v[0-9.]+)-linux-.*/\1/' build/etcd.sha256 \
            | sort --unique --version-sort \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "versions=${versions}" >> "${GITHUB_OUTPUT}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    needs: etcd-versions
    strategy:
      fail-fast: false
      matrix:
        etcd: ${{ fromJSON(needs.etcd-versions.outputs.versions) }}
    name: test (etcd ${{ matrix.etcd }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install etcd
        env:
          ETCD_VERSION: ${{ matrix.etcd }}
        run: |
          archive="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl --silent --show-error --location --fail --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/${archive}"
          grep "  ${archive}\$" build/etcd.sha256 | (cd "${RUNNER_TEMP}" && sha256sum --check --strict)
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          echo "TEST_ETCD_BINARY=${RUNNER_TEMP}/etcd-${ETCD_VERSION}-linux-amd64/etcd" >> "${GITHUB_ENV}"
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for every release platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci
          push: false

  image-etcd:
    runs-on: ubuntu-latest
    needs: etcd-versions
    strategy:
      fail-fast: false
      matrix:
        etcd: ${{ fromJSON(needs.etcd-versions.outputs.versions) }}
    name: image-etcd (etcd ${{ matrix.etcd }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        name: Look up the pinned etcd image
        env:
          ETCD_VERSION: ${{ matrix.etcd }}
        run: |
          image=$(awk -v version="${ETCD_VERSION}" '$1 == version { print $2 }' build/etcd.images)
          if [[ -z "${image}" ]]; then
            echo "etcd ${ETCD_VERSION} is in build/etcd.sha256 but not pinned in build/etcd.images" >&2
            exit 1
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "version=${ETCD_VERSION#v}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for every release platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile.etcd
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci
            ETCD_VERSION=${{ steps.pin.outputs.version }}
            ETCD_IMAGE=${{ steps.pin.outputs.image }}
          push: false

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
