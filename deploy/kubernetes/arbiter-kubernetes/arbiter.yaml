apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  template:
    spec:
      serviceAccountName: twok
      automountServiceAccountToken: true
      initContainers:
        - name: twok
          env:
            # Repeated from the base so that the merged list defines it before
            # TWOK_ARBITER, which refers to it.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TWOK_ARBITER
              value: kubernetes://$(NAMESPACE)/twok-arbiter
