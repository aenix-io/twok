# twok settings, one file per setting, read by the agent from /etc/twok
# (--config-dir). A flag on the agent's command line wins over the file. The
# name follows threek's convention, <cluster>-twok, which is also what
# deploy/twok-agent.yaml mounts into operator Pods. The arbiter URL is set by
# the overlay in the StatefulSet's env, see statefulset.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-twok
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: twok
data:
  poll-interval: 1s
  claim-after: 20s
  claim-delay: 3s
  follower-extra-delay: 5s
  commit-tail: "true"
