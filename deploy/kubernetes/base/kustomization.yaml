apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - pdb.yaml
# The one place where the member image is set. Pin it by digest for anything
# that matters, for example newTag: v3.6.15-main@sha256:<digest>.
images:
  - name: twok-etcd
    newName: ghcr.io/aenix-io/twok-etcd
    newTag: v3.6.15-main
