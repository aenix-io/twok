apiVersion: v1
kind: Service
metadata:
  name: arbiter
  labels:
    app.kubernetes.io/name: twok-arbiter
    app.kubernetes.io/part-of: twok
spec:
  selector:
    app.kubernetes.io/name: twok-arbiter
    app.kubernetes.io/part-of: twok
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arbiter-data
  labels:
    app.kubernetes.io/name: twok-arbiter
    app.kubernetes.io/part-of: twok
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
# The reference HTTP arbiter. One replica on purpose: two servers over two
# copies of the file would not be one compare-and-swap register. Recreate
# makes sure the old Pod is gone before the new one opens the file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter
  labels:
    app.kubernetes.io/name: twok-arbiter
    app.kubernetes.io/part-of: twok
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twok-arbiter
      app.kubernetes.io/part-of: twok
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twok-arbiter
        app.kubernetes.io/part-of: twok
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arbiter
          # Replaced with the members' twok image, see kustomization.yaml.
          image: twok
          command:
            - twok
          args:
            - arbiter
            - serve
            - --dir=/data
            - --listen=:8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arbiter-data
